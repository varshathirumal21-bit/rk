<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Request - Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container" style="max-width: 500px;">
        <div class="app-header">Add Content Request</div>
        <div class="app-content">
            <form method="POST">
                <label style="font-size: 12px; font-weight: bold;">Request Date</label>
                <input type="text" name="request_date" placeholder="17-05-2026" required>

                <label style="font-size: 12px; font-weight: bold;">Name</label>
                <input type="text" name="name" placeholder="Raju" required>

                <label style="font-size: 12px; font-weight: bold;">YouTube Code</label>
                <input type="text" name="youtube_code" placeholder="2026001" required>

                <label style="font-size: 12px; font-weight: bold;">1st Keyword</label>
                <input type="text" name="kw1" placeholder="Keyword 1" required>

                <label style="font-size: 12px; font-weight: bold;">2nd Keyword</label>
                <input type="text" name="kw2" placeholder="Keyword 2" required>

                <label style="font-size: 12px; font-weight: bold;">3rd Keyword</label>
                <input type="text" name="kw3" placeholder="Keyword 3" required>

                <label style="font-size: 12px; font-weight: bold;">Uploaded Files (Yes/No)</label>
                <input type="text" name="uploaded_files" placeholder="Yes" required>

                <button type="submit" class="btn" style="margin-top: 10px;">SAVE REQUEST</button>
            </form>
            <a href="/admin_panel" class="btn btn-danger" style="text-align: center; text-decoration: none; margin-top: 10px;">CANCEL</a>
        </div>
    </div>
</body>
</html>
