<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Scripts - RK Solutions</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container">
        <div class="app-header">50 Sales Scripts (Notepads)[cite: 26]</div>
        <div class="app-content">
            <p style="font-size: 12px; color: #666; margin-bottom: 10px;">Select any sales script document to view content:</p>
            {% for s in scripts %}
            <div class="card">
                <b style="color: #5c2d91; font-size: 13px;">{{ s.title }}</b>
                <p style="font-size: 11px; color: #444; margin-top: 5px; background: #fff; padding: 8px; border-radius: 4px; border: 1px solid #eee;">{{ s.content }}</p>
            </div>
            {% endfor %}
            <a href="/training" class="btn" style="margin-top: 15px;">← Back to Training</a>
        </div>
    </div>
</body>
</html>
